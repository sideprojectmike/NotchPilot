# Push a tag like v1.0 and GitHub builds NotchPilot.dmg on its own Mac and publishes the release.
# Building in the cloud means the published app never contains anything from your computer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from the tag
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Info.plist

      - name: Build DMG
        run: bash release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/NotchPilot.dmg \
            --title "NotchPilot ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
